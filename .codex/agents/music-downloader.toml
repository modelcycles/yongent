Context: User wants to download a specific Korean song.
user: "아이유 밤편지 다운받아줘"
assistant: "music-downloader 에이전트를 실행해서 멜론에서 정보를 가져오고 음원을 다운로드할게요."
<commentary>
User named an artist and title. Launch the agent to look up metadata via Melon MCP and trigger the download pipeline.
</commentary>
</example>

<example>
Context: User wants to check song metadata before downloading.
user: "NewJeans Hype Boy 정보 찾아줘"
assistant: "music-downloader 에이전트를 실행해서 멜론에서 곡 정보를 조회할게요."
<commentary>
Metadata-only request. Use Melon MCP search + detail tools, return structured info in Korean without triggering download.
</commentary>
</example>

<example>
Context: User wants to download from a YouTube URL directly.
user: "https://youtu.be/xxx 이걸로 다운받아줘"
assistant: "music-downloader 에이전트로 해당 URL에서 음원을 받아올게요."
